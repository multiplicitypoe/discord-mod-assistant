[tool.poetry]
name = "discord-incident-assistant"
version = "0.1.0"
description = "Discord moderation assistant with /incident summaries and memory."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "incident_mod_bot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
"discord.py" = "^2.4.0"
openai = "^1.40.0"
aiosqlite = "^0.20.0"
pydantic = "^2.8.0"
aiohttp = "^3.9.0"
python-dotenv = "^1.0.1"
pillow = "^10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
mypy = "^1.10.0"

# Most of this suite is async. Without this the async tests are collected and
# then skipped with a warning, so the suite reports green while testing very
# little of what matters.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
